name: Require staging before master

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master

permissions:
  contents: read

jobs:
  # NOTE: branch protection on master requires this check by the job id
  # "check-base" (GitHub Settings > Branches > master > required status
  # checks). Renaming this job id will silently stop it being enforced —
  # update the branch protection required-checks list in the same change.
  check-base:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow staging to merge into master
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "staging" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PRs into master must come from staging (integration branch) in this repository."
            echo "This PR's head branch is '$HEAD_REF' from repository '$HEAD_REPO'."
            echo "Open it against 'staging' instead: gh pr edit <number> --base staging"
            exit 1
          fi
